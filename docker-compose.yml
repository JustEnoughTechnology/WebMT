version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mexican_train_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/mexican_train.db
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8080
    networks:
      - mexican_train_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mexican_train_frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - mexican_train_network
    restart: unless-stopped

volumes:
  backend_data:

networks:
  mexican_train_network:
    driver: bridge
